name: Release Existing Artifact

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      run_id:
        description: 'Build Run ID (leave blank to use latest)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release-assets
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "Fetching artifact from Run ID: ${{ github.event.inputs.run_id }}"
            gh run download ${{ github.event.inputs.run_id }} --repo ${{ github.repository }} --name firecon-win-x64 --dir ./release-assets
          else
            echo "Fetching artifact from latest build run..."
            gh run download --repo ${{ github.repository }} --name firecon-win-x64 --dir ./release-assets
          fi

      - name: Verify Binary
        run: |
          ls -la ./release-assets
          if [ ! -f "./release-assets/firecon.exe" ]; then
            echo "Binary firecon.exe was not found in the downloaded artifact."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./release-assets/firecon.exe
