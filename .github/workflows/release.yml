name: Rebuild and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clean & Restore
        run: |
          dotnet clean FirewallConsole.csproj -c Release
          dotnet restore FirewallConsole.csproj

      - name: Rebuild & Publish Release Binary
        run: >
          dotnet publish FirewallConsole.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./release_output

      - name: Package Release Zip
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $zipName = "firecon-${tag}-win-x64.zip"
          Compress-Archive -Path ./release_output/* -DestinationPath "./$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.RELEASE_TAG }}
          name: Release ${{ steps.package.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./${{ steps.package.outputs.ZIP_NAME }}
            ./release_output/firecon.exe
