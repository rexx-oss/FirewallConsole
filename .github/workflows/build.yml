name: Manual Build Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish firecon.exe
        run: >
          dotnet publish FirewallConsole.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Create Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./firecon-win-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firecon-win-x64
          path: |
            ./firecon-win-x64.zip
            ./publish/firecon.exe
          retention-days: 30
