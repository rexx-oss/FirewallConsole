name: Build Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Convert icon.png to icon.ico
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile("icon.png")
          $thumb = New-Object System.Drawing.Bitmap $bmp, (New-Object System.Drawing.Size 128, 128)
          $h = $thumb.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($h)
          $fs = [System.IO.FileStream]::new("icon.ico", [System.IO.FileMode]::Create)
          $ico.Save($fs)
          $fs.Close()

      - name: Publish firecon.exe
        run: >
          dotnet publish FirewallConsole.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firecon-win-x64
          path: ./publish/firecon.exe
          retention-days: 30
